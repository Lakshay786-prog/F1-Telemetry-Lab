<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>F1 Telemetry Lab</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">
            F1<span>TELEMETRY</span>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            SYSTEM ONLINE
        </div>
    </header>


    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <nav>
                <button class="nav-item active">Dashboard</button>
                <button class="nav-item">Races</button>
                <button class="nav-item">Drivers</button>
                <button class="nav-item">Telemetry</button>
                <button class="nav-item">Analysis</button>
            </nav>

        </aside>


        <!-- Main Content -->
        <main class="main">

            <section class="page-header">

                <div>
                    <p class="eyebrow">RACE ANALYSIS</p>
                    <h1>F1 Telemetry Lab</h1>
                    <p>
                        Analyze lap-by-lap driver telemetry and performance.
                    </p>
                </div>

            </section>


            <!-- Race Selection -->
            <section class="selection-panel">

                <div class="select-group">
                    <label for="season">Season</label>

                    <select id="season">
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                    </select>
                </div>


                <div class="select-group">
                    <label for="race">Race</label>

                    <select id="race">
                        <option value="">Select Race</option>
                        <option value="australia">
                            Australian Grand Prix
                        </option>

                        <option value="japan">
                            Japanese Grand Prix
                        </option>

                        <option value="monaco">
                            Monaco Grand Prix
                        </option>

                        <option value="monza">
                            Italian Grand Prix
                        </option>
                    </select>
                </div>


                <div class="select-group">
                    <label for="session">Session</label>

                    <select id="session">

                        <option value="R">Race</option>
                        <option value="Q">Qualifying</option>
                        <option value="FP1">Practice 1</option>
                        <option value="FP2">Practice 2</option>
                        <option value="FP3">Practice 3</option>

                    </select>
                </div>


                <div class="select-group">
                    <label for="driver">Driver</label>

                    <select id="driver">

                        <option value="">Select Driver</option>

                        <option value="VER">
                            Max Verstappen
                        </option>

                        <option value="NOR">
                            Lando Norris
                        </option>

                        <option value="LEC">
                            Charles Leclerc
                        </option>

                        <option value="HAM">
                            Lewis Hamilton
                        </option>

                    </select>
                </div>


                <div class="select-group">
                    <label for="lap">Lap</label>

                    <select id="lap">

                        <option value="">Select Lap</option>

                        <option value="1">Lap 1</option>
                        <option value="2">Lap 2</option>
                        <option value="3">Lap 3</option>
                        <option value="4">Lap 4</option>
                        <option value="5">Lap 5</option>

                    </select>
                </div>

            </section>


            <!-- Track -->
            <section class="track-panel">

                <div class="panel-header">

                    <div>
                        <p class="eyebrow">CIRCUIT</p>
                        <h2>Track Visualization</h2>
                    </div>

                    <div class="lap-status">
                        LAP <strong id="current-lap">32</strong>
                    </div>

                </div>


                <div class="track">

                    <div class="track-line"></div>

                    <div class="car" id="car">
                        🏎️
                    </div>

                </div>

            </section>


            <!-- Telemetry Cards -->
            <section class="telemetry-grid">

                <div class="telemetry-card">

                    <span>Speed</span>

                    <strong id="speed">
                        312
                    </strong>

                    <small>km/h</small>

                </div>


                <div class="telemetry-card">

                    <span>Throttle</span>

                    <strong id="throttle">
                        98
                    </strong>

                    <small>%</small>

                </div>


                <div class="telemetry-card">

                    <span>Brake</span>

                    <strong id="brake">
                        0
                    </strong>

                    <small>%</small>

                </div>


                <div class="telemetry-card">

                    <span>Gear</span>

                    <strong id="gear">
                        8
                    </strong>

                </div>


                <div class="telemetry-card">

                    <span>RPM</span>

                    <strong id="rpm">
                        11,450
                    </strong>

                </div>


                <div class="telemetry-card">

                    <span>Lap Time</span>

                    <strong id="lap-time">
                        1:21.342
                    </strong>

                </div>

            </section>


            <!-- Graph Area -->
            <section class="graph-panel">

                <div class="panel-header">

                    <div>
                        <p class="eyebrow">TELEMETRY</p>
                        <h2>Lap Telemetry</h2>
                    </div>

                </div>

                <div class="graph-placeholder">

                    <p>
                        Telemetry graph will appear here
                    </p>

                </div>

            </section>

        </main>

    </div>


    <script src="script.js"></script>

</body>
</html>
